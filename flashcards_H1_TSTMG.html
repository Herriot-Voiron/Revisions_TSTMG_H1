<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Flashcards H1 Totalitarismes et Seconde Guerre mondiale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : une colonne centrée façon « boîte à fiches bristol ». Les cartes sont des fiches lignées, chaque thème a sa couleur d'onglet. */
:root{
  --paper:#E8EBEE; --card:#FFFFFF; --ink:#18202C; --ink-2:#4F5B6B; --line:#CBD3DC;
  --rule:#C9DAEE; --margin:#E6A3A3; --accent:#1E3A8A; --accent-ink:#FFFFFF; --gold:#A86A0C;
  --ok:#15803D; --mid:#B45309; --ko:#B91C1C; --shadow:rgba(24,32,44,.12);
  --c-def:#0F766E; --c-dates:#A15C07; --c-urss:#B42318; --c-nazi:#4B5565; --c-fp:#1D4ED8; --c-approf:#7C3AED; --c-anea:#9F1239; --c-methode:#4D7C0F;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10151C; --card:#19212B; --ink:#E7EBF0; --ink-2:#9DA9B8; --line:#2C3746;
  --rule:#22334A; --margin:#5C2E2E; --accent:#9DB7FF; --accent-ink:#0E1626; --gold:#E3B252;
  --ok:#4ADE80; --mid:#FBBF24; --ko:#F87171; --shadow:rgba(0,0,0,.45);
  --c-def:#2DD4BF; --c-dates:#F0B429; --c-urss:#F87171; --c-nazi:#A9B4C2; --c-fp:#7EA6FF; --c-approf:#B794F6; --c-anea:#FB7185; --c-methode:#A3E635;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10151C; --card:#19212B; --ink:#E7EBF0; --ink-2:#9DA9B8; --line:#2C3746;
  --rule:#22334A; --margin:#5C2E2E; --accent:#9DB7FF; --accent-ink:#0E1626; --gold:#E3B252;
  --ok:#4ADE80; --mid:#FBBF24; --ko:#F87171; --shadow:rgba(0,0,0,.45);
  --c-def:#2DD4BF; --c-dates:#F0B429; --c-urss:#F87171; --c-nazi:#A9B4C2; --c-fp:#7EA6FF; --c-approf:#B794F6; --c-anea:#FB7185; --c-methode:#A3E635;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono)}
.muted{color:var(--ink-2)}

/* ---------- Barre du haut ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.tab-h2{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;padding:6px 10px 4px;border:2.5px solid var(--ink);border-radius:4px;letter-spacing:.02em}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase}
.brand-txt span{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
.navbtns{display:flex;gap:8px}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.ghost:hover{border-color:var(--ink-2)}

/* ---------- Tableau de bord ---------- */
.dash{background:var(--card);border-radius:14px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px var(--shadow);padding:20px;display:grid;gap:18px}
.player{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lvl{width:66px;height:66px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:900;font-size:32px;line-height:1;position:relative}
.lvl small{position:absolute;bottom:-8px;font-family:var(--f-mono);font-size:10px;background:var(--card);color:var(--ink);border:1.5px solid var(--accent);border-radius:999px;padding:1px 7px;letter-spacing:.06em}
.pinfo{flex:1;min-width:200px}
.pname{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pname h2{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1;text-transform:uppercase;letter-spacing:.01em}
.namefield{display:flex;gap:6px;align-items:center;margin-top:2px}
.namefield input{font:inherit;font-size:16px;padding:5px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:180px;max-width:100%}
.xpbar{height:12px;border-radius:999px;background:var(--paper);overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px;transition:width .6s ease}
.xptxt{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);margin-top:4px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-2);line-height:1.25;display:block;margin-top:3px}
.stat.ready b{color:var(--ok)}
.stat.fire b{color:var(--mid)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}

.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px;flex-wrap:wrap}
.sec-title h3{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* Thèmes = onglets de boîte à fiches */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.theme{--c:var(--accent);text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 12px 10px;display:grid;gap:6px;position:relative;transition:border-color .15s,transform .15s}
.theme:hover{transform:translateY(-1px)}
.theme[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--card);background:color-mix(in srgb,var(--c) 7%,var(--card))}
.theme .th-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.theme .th-name{font-weight:700;font-size:15.5px;line-height:1.2;color:var(--ink)}
.chk{width:20px;height:20px;border-radius:5px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.theme[aria-pressed="true"] .chk{background:var(--c);border-color:var(--c)}
.theme[aria-pressed="true"] .chk::after{content:"";width:10px;height:5px;border-left:2.5px solid var(--card);border-bottom:2.5px solid var(--card);transform:rotate(-45deg) translate(1px,-1px)}
.th-meta{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.mbar{height:6px;border-radius:999px;background:var(--paper);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--c);border-radius:999px}
.theme .dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;margin-right:7px;vertical-align:1px}

/* Modes */
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:700px){.modes{grid-template-columns:1fr}}
.mode{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
.mode h4{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.mode p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.4}
.seg{display:flex;gap:4px;background:var(--paper);border-radius:999px;padding:3px;width:max-content;max-width:100%}
.seg button{border:0;background:transparent;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .12s}
.go:hover{filter:brightness(1.08)}
.go:active{transform:scale(.98)}
.go.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.go[disabled]{opacity:.45;cursor:not-allowed}
.review-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;padding:12px 14px;border-radius:10px;border:1.5px dashed var(--ko);background:var(--card);background:color-mix(in srgb,var(--ko) 6%,var(--card))}
.review-banner p{margin:0;font-size:14.5px;min-width:0}
.review-banner .go{background:var(--ko);color:var(--card)}

.badge-strip{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Session ---------- */
.sess-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog{flex:1;height:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
.sess-count{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.combo{font-family:var(--f-display);font-weight:900;font-size:19px;color:var(--mid);min-width:64px;text-align:right;letter-spacing:.02em}
.combo.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.35)}}

.stage{perspective:1600px}
.flip{display:grid;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.75,.25,1);cursor:pointer;-webkit-tap-highlight-color:transparent}
.flip.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:14px;box-shadow:0 1px 0 var(--line),0 18px 40px -22px var(--shadow);min-height:340px;display:flex;flex-direction:column;overflow:hidden;--c:var(--accent)}
.face.back{transform:rotateY(180deg)}
/* fiche bristol : lignes bleues + marge rouge */
.ruled{flex:1;display:flex;flex-direction:column;padding:22px 22px 18px 44px;position:relative;
  background-image:linear-gradient(var(--card) 0 0),repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px);
  background-size:2px 100%,100% 100%;background-repeat:no-repeat;background-position:30px 0,0 6px}
.ruled::before{content:"";position:absolute;left:32px;top:0;bottom:0;width:1.5px;background:var(--margin)}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:3px solid var(--c);background:var(--card);background:color-mix(in srgb,var(--c) 9%,var(--card))}
.ftag{font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.fbox{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);display:flex;gap:3px;align-items:center}
.fbox i{width:8px;height:8px;border-radius:2px;background:var(--line);display:inline-block}
.fbox i.on{background:var(--c)}
.q{font-weight:700;font-size:clamp(21px,3.6vw,28px);line-height:1.3;margin:auto 0;text-wrap:balance;padding-block:18px}
.hint{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);text-align:center;letter-spacing:.04em;margin-top:auto}
.ans-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);font-weight:600}
.ans{font-weight:700;font-size:clamp(18px,2.8vw,22px);line-height:1.35;margin:4px 0 10px}
.det{font-size:15.5px;line-height:1.6;margin:0 0 12px;color:var(--ink)}
.det ul{margin:4px 0;padding-left:20px}
.plus{margin-top:auto;border-radius:10px;padding:10px 12px;background:var(--card);background:color-mix(in srgb,var(--c-approf) 8%,var(--card));border:1px solid color-mix(in srgb,var(--c-approf) 30%,var(--card));font-size:14.5px;line-height:1.5}
.plus b.lab{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--c-approf);margin-bottom:2px}
.qback{font-size:13.5px;color:var(--ink-2);margin:0 0 6px;font-style:italic}

.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.rate button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 8px;font-weight:700;font-size:15px;display:grid;gap:2px;justify-items:center;transition:transform .1s}
.rate button small{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--ink-2)}
.rate button:active{transform:scale(.97)}
.rate .r0{border-color:var(--ko);color:var(--ko)}
.rate .r1{border-color:var(--mid);color:var(--mid)}
.rate .r2{border-color:var(--ok);color:var(--ok)}
.rate .r0:hover{background:var(--card);background:color-mix(in srgb,var(--ko) 8%,var(--card))}
.rate .r1:hover{background:var(--card);background:color-mix(in srgb,var(--mid) 8%,var(--card))}
.rate .r2:hover{background:var(--card);background:color-mix(in srgb,var(--ok) 8%,var(--card))}
.reveal{margin-top:14px;width:100%}
.keys{text-align:center;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);margin-top:10px}
@media (hover:none){.keys{display:none}}
.xpfloat{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-family:var(--f-display);font-weight:900;font-size:38px;color:var(--gold);pointer-events:none;animation:xpf .9s ease forwards;z-index:30;text-shadow:0 2px 0 var(--card)}
@keyframes xpf{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px)}}

/* QCM */
.qcm-opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15.5px;line-height:1.4;display:flex;gap:12px;align-items:flex-start}
.opt .l{font-family:var(--f-mono);font-weight:600;width:26px;height:26px;flex:none;border-radius:6px;display:grid;place-items:center;background:var(--paper);font-size:13px}
.opt:hover:not([disabled]){border-color:var(--ink-2)}
.opt.good{border-color:var(--ok);background:var(--card);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.opt.bad{border-color:var(--ko);background:var(--card);background:color-mix(in srgb,var(--ko) 10%,var(--card))}
.opt[disabled]{cursor:default}
.feedback{margin-top:12px;border-radius:12px;padding:12px 14px;background:var(--card);border-left:5px solid var(--ok);font-size:15px}
.feedback.ko{border-left-color:var(--ko)}
.feedback b.v{display:block;font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.timer{height:4px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:-2px}
.timer i{display:block;height:100%;background:var(--gold);width:100%}

/* Frise */
.frise-pool{display:grid;gap:10px;margin-top:14px}
.ev{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:15.5px;line-height:1.35;--c:var(--accent)}
.ev .n{width:32px;height:32px;flex:none;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:19px}
.ev.picked{border-color:var(--accent)}
.ev.picked .n{border:0;background:var(--accent);color:var(--accent-ink)}
.ev .tg{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);display:block}
.ev .yr{margin-left:auto;font-family:var(--f-mono);font-weight:600;font-size:13px;white-space:nowrap}
.ev.right{border-color:var(--ok)}
.ev.wrong{border-color:var(--ko)}
.ev.right .n{background:var(--ok);color:var(--card)}
.ev.wrong .n{background:var(--ko);color:var(--card)}
.timeline{position:relative;margin-top:16px;padding-left:22px;display:grid;gap:10px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:3px;background:var(--line);border-radius:2px}
.tl{position:relative;font-size:15px}
.tl::before{content:"";position:absolute;left:-20px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--c,var(--accent));border:2px solid var(--card)}
.tl b{font-family:var(--f-mono);font-size:13px;margin-right:8px}

/* Fin de session */
.endcard{background:var(--card);border-radius:14px;padding:22px;box-shadow:0 1px 0 var(--line),0 18px 40px -22px var(--shadow);display:grid;gap:16px}
.endcard h2{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,6vw,44px);text-transform:uppercase;line-height:1}
.endstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.endstats{grid-template-columns:repeat(2,1fr)}}
.endstats .stat b.k{color:var(--ko)} .endstats .stat b.m{color:var(--mid)} .endstats .stat b.o{color:var(--ok)} .endstats .stat b.x{color:var(--gold)}
.miss{display:grid;gap:8px}
.miss details{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;--c:var(--accent)}
.miss summary{cursor:pointer;font-weight:700;font-size:15px;list-style-position:outside}
.miss summary .ftag{margin-right:8px}
.miss details p{margin:8px 0 0;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .go{flex:1;min-width:180px}

/* Badges */
.medal{width:92px;display:grid;justify-items:center;gap:6px;text-align:center}
.medal .disc{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--gold) 55%,var(--card)),var(--gold));color:var(--card);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 0 0 3px var(--card),0 0 0 5px var(--gold)}
.medal .disc svg{width:30px;height:30px}
.medal span{font-size:12px;font-weight:700;line-height:1.2}
.medal.locked .disc{background:var(--paper);color:var(--ink-2);box-shadow:inset 0 0 0 2px var(--line);opacity:.8}
.medal.locked span{color:var(--ink-2);font-weight:400}
.badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.bitem{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px}
.bitem .medal{width:auto}
.bitem .medal .disc{width:52px;height:52px}
.bitem .medal .disc svg{width:24px;height:24px}
.bitem b{display:block;font-size:15px}
.bitem p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.35}
.bitem.locked b{color:var(--ink-2)}
.bilan{background:var(--card);border-radius:14px;padding:20px;border:2px solid var(--ink);display:grid;gap:12px;position:relative;overflow:hidden}
.bilan .stamp{position:absolute;right:14px;top:14px;transform:rotate(8deg);border:3px solid var(--ok);color:var(--ok);font-family:var(--f-display);font-weight:900;font-size:18px;text-transform:uppercase;padding:2px 10px;border-radius:6px;letter-spacing:.04em}
.bilan h2{font-family:var(--f-display);font-weight:900;font-size:28px;text-transform:uppercase;padding-right:120px}
.tbars{display:grid;gap:7px}
.tbar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:14px;--c:var(--accent)}
.tbar .mbar{height:9px}
.tbar b{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:480px){.tbar{grid-template-columns:110px 1fr 40px;font-size:13px}}
.danger{background:none;border:1.5px solid var(--ko);color:var(--ko);border-radius:8px;padding:7px 12px;font-weight:700;font-size:13.5px}
.confirm-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 16px 12px 12px;display:flex;align-items:center;gap:12px;z-index:40;transition:transform .45s cubic-bezier(.2,.9,.3,1.2);max-width:calc(100% - 32px);box-shadow:0 12px 30px -10px var(--shadow)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .medal .disc{width:46px;height:46px;box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--gold)}
.toast .medal .disc svg{width:22px;height:22px}
.toast small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.toast b{font-size:16px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:35}
.foot{margin-top:34px;font-size:12.5px;color:var(--ink-2);text-align:center;font-family:var(--f-mono)}
.fade-in{animation:fin .3s ease}
@keyframes fin{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .flip{transform:none!important}
  .face.back{transform:none}
  .flip .face.back{visibility:hidden}
  .flip.flipped .face.front{visibility:hidden}
  .flip.flipped .face.back{visibility:visible}
}

.plan{display:grid;gap:8px;margin-top:2px}
.plan>div{border-radius:8px;padding:8px 10px;background:var(--card);background:color-mix(in srgb,var(--c-methode) 7%,var(--card));border:1px solid color-mix(in srgb,var(--c-methode) 25%,var(--card));line-height:1.45}
.plan>div b{display:block;font-size:.95em}
.plan .pl-i{background:transparent;border-style:dashed}
.plan .pl-p b{color:var(--c-methode);text-transform:uppercase;letter-spacing:.02em}

.how{margin-top:16px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px}
.how h3{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 8px}
.how ol{margin:0;padding:0;list-style:none;counter-reset:st;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.how li{counter-increment:st;font-size:14.5px;line-height:1.4;display:grid;gap:4px;align-content:start;min-width:0}
.how li::before{content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:17px}
.how p{margin:12px 0 0;font-size:14px;color:var(--ink-2)}
@media (max-width:640px){.how ol{grid-template-columns:1fr 1fr}}

/* Tactile : pas de zoom au double appui, pas de surlignage gris, pas de sélection en touchant la carte */
button,.flip,.opt,.ev,.theme{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.flip{-webkit-user-select:none;user-select:none}
/* Les boutons de notation restent visibles en bas de l'écran, même si le corrigé est long */
#actions{position:sticky;bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 70%,transparent);z-index:3}
#actions .rate,#actions .reveal{margin-top:10px}
/* Écrans peu hauts (téléphone à l'horizontale) */
@media (max-height:520px){
  .face{min-height:200px}
  .q{padding-block:8px;font-size:20px}
  .ruled{padding-top:12px;padding-bottom:10px}
  .wrap{padding-block:10px 30px}
  .rate button{padding:8px 6px}
}
/* Tablettes : 4 colonnes de thèmes */
@media (min-width:760px) and (max-width:1100px){.themes{grid-template-columns:repeat(4,1fr)}}

.namefield select{font:inherit;font-size:16px;padding:5px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);max-width:100%}
.namefield select.need{border-color:var(--mid);box-shadow:0 0 0 2px color-mix(in srgb,var(--mid) 25%,transparent)}
.namefield{flex-wrap:wrap}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px}
.chip svg{color:var(--accent);flex:none}

.mode.exam{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.veille{justify-self:start;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mid);border:1.5px solid var(--mid);border-radius:999px;padding:2px 10px}
.opt.chosen{border-color:var(--accent);background:var(--card);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.opt.chosen .l{background:var(--accent);color:var(--accent-ink)}
.note20{font-size:clamp(56px,12vw,84px)!important;color:var(--accent)}
.note20 small{font-size:.4em;color:var(--ink-2);margin-left:4px}
.review-banner.today{margin-top:0;margin-bottom:14px;border-style:solid;border-color:var(--mid);background:var(--card);background:color-mix(in srgb,var(--mid) 8%,var(--card))}
.review-banner.today .go{background:var(--mid);color:var(--card)}
/* Construire un plan */
.subj{display:grid;gap:10px;margin-top:14px}
.skel{display:grid;gap:3px;margin-top:6px}
.skel div{font-weight:700;font-size:15px}
.skel b{font-family:var(--f-mono);color:var(--c-methode);margin-right:8px}
.idea{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:12px;align-items:center;margin-top:8px}
.idea p{margin:0;flex:1;font-size:15px;line-height:1.4}
.idea .why{display:block;font-size:13px;font-weight:700;color:var(--ko);margin-top:3px}
.idea.right{border-color:var(--ok)}
.idea.wrong{border-color:var(--ko)}
.idea .seg button{min-width:40px;padding:6px 10px;font-size:14px}
.idea .seg button[disabled]{cursor:default}
.plan ul{margin:2px 0 0;padding-left:18px}
@media (max-width:560px){.idea{flex-direction:column;align-items:stretch}.idea .seg{align-self:flex-end}}
.mode.exam{grid-column:1/-1}

{id:"n2",t:"nazi",g:"qui",q:"Dans quel livre Hitler expose-t-il son programme ?",a:"<i>Mein Kampf</i> (« Mon combat »).",d:"Espace vital à l'est, supériorité de la « race aryenne », haine des Juifs.",s:"Mein Kampf"},
{id:"n3",t:"nazi",g:null,q:"Quelles sont les grandes idées de l'<b>idéologie nazie</b> ?",a:"Les Aryens seraient une « race de seigneurs » qui doit dominer le monde pour 1000 ans ; les Juifs seraient des « parasites » ; les Allemands ont besoin d'un « espace vital » à l'est.",d:"Une idéologie <b>raciste</b>, <b>antisémite</b> et <b>nationaliste</b>."},
{id:"n4",t:"nazi",g:"qui",q:"Quel titre prend Hitler, objet d'un culte de la personnalité ?",a:"Le <i>Führer</i> (le guide).",s:"Le Führer"},
{id:"n5",t:"nazi",g:"qui",q:"Quelle organisation embrigade les enfants allemands ?",a:"La <i>Hitlerjugend</i> (Jeunesse hitlérienne).",d:"Elle les endoctrine pour en faire des soldats.",s:"La Hitlerjugend"},
{id:"n6",t:"nazi",g:null,q:"Quels sont les moyens de la <b>propagande</b> nazie ?",a:"Radio, cinéma, affiches, tableaux, parades grandioses.",d:"La propagande est partout : elle célèbre le Führer et diffuse l'idéologie nazie."},
{id:"n7",t:"nazi",g:"qui",q:"Comment s'appelle la police politique nazie ?",a:"La Gestapo.",d:"Elle surveille la population et arrête les opposants.",s:"La Gestapo"},
{id:"n8",t:"nazi",g:"qui",q:"Quelles milices du parti nazi font régner la terreur dans les rues ?",a:"Les SA, puis les SS.",d:"Les SS dirigent ensuite les camps.",s:"Les SA puis les SS"},
{id:"n9",t:"nazi",g:null,q:"Quels sont les deux types de camps nazis ?",a:"Les camps de concentration pour les opposants ; les camps d'extermination pour les « races inférieures ».",d:"Dachau, premier camp de concentration, ouvre dès 1933. Les camps d'extermination tuent surtout les Juifs, de 1942 à 1945."},
{id:"n10",t:"nazi",g:null,q:"Comment Hitler prépare-t-il la guerre ?",a:"Il remilitarise l'Allemagne (chars, avions…), contre le traité de Versailles de 1919.",d:"Il annexe l'Autriche dès 1938 (<i>Anschluss</i>) pour construire le Grand Reich."},
{id:"n11",t:"nazi",g:null,q:"Qu'est-ce que le <b>Grand Reich</b> voulu par Hitler ?",a:"Un État qui regrouperait tous ceux qui parlent allemand, avec un vaste espace vital à l'est.",d:"Première étape : l'<i>Anschluss</i> (annexion de l'Autriche) en 1938."},
{id:"n12",t:"nazi",g:null,q:"Comment le régime nazi contrôle-t-il et réprime-t-il la population ? (3 moyens)",a:"Propagande et embrigadement (<i>Hitlerjugend</i>) ; police politique (Gestapo) et milices (SA, SS) ; camps de concentration et d'extermination.",d:"C'est le cœur du sujet 1 : <b>convaincre</b>, <b>surveiller</b>, <b>éliminer</b>."},

/* ================= URSS ================= */
{id:"u1",t:"urss",g:"qui",q:"Qui dirige l'URSS à partir de 1924 ?",a:"Staline.",d:"Il s'impose à la tête du Parti communiste.",s:"Staline"},
{id:"u2",t:"urss",g:null,q:"Comment Staline s'impose-t-il au pouvoir ?",a:"Il élimine ses opposants parmi les successeurs possibles de Lénine.",d:"Il prend le pouvoir à l'intérieur du parti, sans élection libre.",p:"Différence avec Hitler, arrivé au pouvoir légalement."},
{id:"u3",t:"urss",g:null,q:"Quel est le but affiché de Staline ?",a:"Instaurer le communisme : l'égalité de tous et la disparition des patrons.",d:"Pour cela : plans quinquennaux et collectivisation des terres."},
{id:"u4",t:"urss",g:null,q:"Comment Staline contrôle-t-il l'<b>économie</b> ?",a:"Par les plans quinquennaux et la collectivisation des terres.",d:"Les paysans qui refusent (koulaks) sont affamés, notamment en Ukraine (1932-1933)."},
{id:"u5",t:"urss",g:null,q:"Quels sont les moyens de la <b>propagande</b> stalinienne ?",a:"Cinéma, slogans, affiches, statues, grands rassemblements patriotiques.",d:"Ils diffusent le culte de Staline et l'idéologie communiste."},
{id:"u6",t:"urss",g:"qui",q:"Quelle organisation encadre la jeunesse soviétique ?",a:"Les pionniers.",d:"C'est l'équivalent soviétique de la <i>Hitlerjugend</i>.",s:"Les pionniers"},
{id:"u7",t:"urss",g:"qui",q:"Comment s'appelle la police politique de Staline ?",a:"Le NKVD.",d:"Il surveille, arrête et fait disparaître les opposants.",s:"Le NKVD"},
{id:"u8",t:"urss",g:null,q:"Quel rôle joue la <b>dénonciation</b> en URSS ?",a:"Staline l'encourage, y compris par les enfants contre leurs parents.",d:"Chacun surveille tout le monde : la peur s'installe partout."},
{id:"u9",t:"urss",g:null,q:"À quoi servent les camps du <b>goulag</b> ?",a:"À faire disparaître les opposants, soumis au travail forcé.",d:"Le Goulag est le ministère chargé de ces camps."},
{id:"u10",t:"urss",g:null,q:"Qui sont les <b>koulaks</b> et que leur arrive-t-il ?",a:"Des paysans qui refusent la collectivisation ; Staline les affame (Ukraine).",d:"La famine de 1932-1933 fait des millions de morts."},
{id:"u11",t:"urss",g:null,q:"Comment Staline contrôle-t-il et réprime-t-il la population ? (3 moyens)",a:"Propagande et encadrement de la jeunesse (pionniers) ; police politique (NKVD) et dénonciation ; camps du goulag et famine des koulaks.",d:"Même logique que l'Allemagne nazie : <b>convaincre</b>, <b>surveiller</b>, <b>éliminer</b>."},

/* ================= GUERRE TOTALE ================= */
{id:"g1",t:"totale",g:"chiffre",q:"Combien de soldats se sont battus pendant la Seconde Guerre mondiale ?",a:"Environ 100 millions.",d:"Jamais autant d'hommes n'avaient été mobilisés.",s:"Environ 100 millions"},
{id:"g2",t:"totale",g:null,q:"Comment l'<b>économie</b> est-elle mobilisée ?",a:"Les belligérants mettent tout leur appareil industriel au service de la guerre.",d:"Les usines produisent des armes, des chars, des avions, des munitions."},
{id:"g3",t:"totale",g:null,q:"Comment les <b>civils</b> participent-ils à la guerre ?",a:"Ils participent à l'effort de guerre (travail dans les usines…), encouragés par une intense propagande.",d:"Dans une guerre totale, toute la société est mobilisée."},
{id:"g4",t:"totale",g:null,q:"Qu'est-ce que la <b>course à l'armement</b> ?",a:"Chaque pays modernise ses armes pour avoir un avantage sur l'ennemi.",d:"Outils de détection (radar, sonar) et armes plus meurtrières : missile V2, bombe atomique."},
{id:"g5",t:"totale",g:"mot",q:"Comment s'appelle le missile mis au point par l'Allemagne ?",a:"Le V2.",s:"V2"},
{id:"g6",t:"totale",g:"mot",q:"Quels outils de détection sont mis au point pendant la guerre ?",a:"Le radar et le sonar.",s:"Radar et sonar"},
{id:"g7",t:"totale",g:"qui",q:"Quelles villes japonaises sont détruites par la bombe atomique ?",a:"Hiroshima (6 août 1945) et Nagasaki (9 août 1945).",d:"Le Japon capitule le 2 septembre 1945.",s:"Hiroshima et Nagasaki"},
{id:"g8",t:"totale",g:null,q:"Qui sont les <b>kamikazes</b> ?",a:"Des pilotes japonais qui lancent leur avion chargé d'explosifs sur les navires ennemis.",d:"Exemple : la bataille d'Okinawa (1945). Ils montrent la mobilisation totale de la société japonaise."},
{id:"g9",t:"totale",g:null,q:"Pourquoi la Seconde Guerre mondiale est-elle une <b>guerre totale</b> ? (3 arguments)",a:"Mobilisation des hommes (100 millions de soldats), de l'économie (industrie de guerre) et des civils (effort de guerre, propagande) ; course à l'armement.",d:"C'est la partie I du sujet 2."},

/* ================= ANÉANTISSEMENT ET BILAN ================= */
{id:"e1",t:"anea",g:null,q:"Pourquoi la guerre est-elle aussi un <b>conflit idéologique</b> ?",a:"L'Axe et les Alliés s'opposent par leurs idées : le but est de détruire totalement l'adversaire.",d:"L'ennemi est <b>déshumanisé</b> : on parle de guerre d'anéantissement."},
{id:"e2",t:"anea",g:null,q:"Qui commet des <b>massacres de masse</b> ?",a:"Les Allemands, les Soviétiques et les Japonais.",d:"Massacre de masse = tuer de nombreuses personnes en peu de temps, souvent par fusillade."},
{id:"e3",t:"anea",g:null,q:"Qui pratique les <b>bombardements urbains</b>, et dans quel but ?",a:"Les Alliés comme les forces de l'Axe, pour détruire routes, ponts, usines et villes et miner le moral de l'adversaire.",d:"Les civils sont des cibles.",p:"Exemples : Londres bombardée par l'Allemagne (1940-1941), Hiroshima et Nagasaki (1945)."},
{id:"e4",t:"anea",g:"qui",q:"Quelle opération extermine l'élite polonaise dès septembre 1939 ?",a:"L'opération Tannenberg.",d:"Les nazis mènent une « purification ethnique » des territoires conquis.",s:"L'opération Tannenberg"},
{id:"e5",t:"anea",g:"qui",q:"Qui sont les commandos chargés de l'assassinat de masse des civils à l'Est ?",a:"Les Einsatzgruppen.",d:"Ils exécutent les communistes et les Juifs, sans distinction d'âge ni de sexe.",s:"Les Einsatzgruppen"},
{id:"e6",t:"anea",g:"chiffre",q:"Combien de personnes les Einsatzgruppen assassinent-ils à partir de l'été 1941 ?",a:"Près de 1,5 million.",d:"On parle de « Shoah par balles ».",s:"Près de 1,5 million"},
{id:"e7",t:"anea",g:"chiffre",q:"Combien de Juifs sont victimes du génocide nazi ?",a:"Près de 5,7 millions.",d:"Dont 3 millions dans les camps d'extermination (1942-1945).",s:"Près de 5,7 millions"},
{id:"e8",t:"anea",g:"chiffre",q:"Combien de Juifs sont tués dans les camps d'extermination ?",a:"Environ 3 millions, entre 1942 et 1945.",d:"Ils sont tués dans des chambres à gaz ; les corps sont brûlés dans des fours crématoires.",s:"Environ 3 millions"},
{id:"e9",t:"anea",g:"chiffre",q:"Combien de Tsiganes sont tués par les nazis ?",a:"Entre 100 000 et 200 000.",s:"100 000 à 200 000"},
{id:"e10",t:"anea",g:"chiffre",q:"Quel est le bilan humain mondial de la Seconde Guerre mondiale ?",a:"Entre 50 et 70 millions de morts, dont plus de la moitié de civils.",d:"C'est la guerre la plus meurtrière de l'histoire.",s:"50 à 70 millions de morts"},
{id:"e11",t:"anea",g:null,q:"Quelles sont les conséquences humaines <b>après</b> la guerre ?",a:"Des dizaines de millions de réfugiés errent sur les routes ; la famine continue pendant des années en Europe et en Asie.",d:"En France, les tickets de rationnement ne disparaissent qu'en 1949."},
{id:"e12",t:"anea",g:null,q:"Que découvre l'Armée rouge le <b>27 janvier 1945</b> ?",a:"Le camp d'Auschwitz, qu'elle libère.",d:"Elle découvre l'horreur du génocide des Juifs."},
{id:"e13",t:"anea",g:null,q:"Pourquoi la Seconde Guerre mondiale est-elle une <b>guerre d'anéantissement</b> ? (3 arguments)",a:"Un conflit idéologique où l'ennemi est déshumanisé ; des massacres de masse et des bombardements urbains ; une politique d'extermination (Tannenberg, Einsatzgruppen, Shoah).",d:"C'est la partie II du sujet 2."},

/* ================= COMPARER ET COMPOSER ================= */
{id:"a1",t:"approf",g:null,q:"Quels sont les <b>points communs</b> entre l'Allemagne nazie et l'URSS de Staline ?",a:"Un chef adulé, une idéologie imposée par la propagande, l'embrigadement de la jeunesse, une police politique, des camps.",d:"Ce sont deux <b>régimes totalitaires</b>."},
{id:"a2",t:"approf",g:null,q:"Quelle est la grande différence d'<b>idéologie</b> ?",a:"Le communisme veut l'égalité de tous ; le nazisme affirme l'inégalité des « races ».",d:"Les victimes diffèrent : opposants et koulaks en URSS ; opposants, Juifs et Tsiganes en Allemagne."},
{id:"a3",t:"approf",g:null,q:"Quelle différence dans la <b>prise du pouvoir</b> ?",a:"Hitler arrive légalement au pouvoir en 1933 ; Staline s'impose en 1924 en éliminant ses rivaux dans le parti.",d:"Deux chemins différents, le même résultat : un pouvoir totalitaire."},
{id:"a4",t:"approf",g:null,q:"Comment les régimes totalitaires conduisent-ils à la violence extrême de la guerre ?",a:"Leur idéologie appelle à la conquête (espace vital) et déshumanise l'ennemi ; ils pratiquent déjà la terreur et les camps avant 1939.",d:"C'est la problématique du chapitre."},
{id:"a5",t:"approf",g:null,q:"Quelle différence entre <b>guerre totale</b> et <b>guerre d'anéantissement</b> ?",a:"La guerre totale mobilise toutes les ressources ; la guerre d'anéantissement vise à détruire totalement l'ennemi, civils compris.",d:"La Seconde Guerre mondiale est les deux à la fois."},
{id:"a6",t:"approf",g:null,q:"Quelles sont les 4 étapes d'une <b>introduction</b> ?",a:"Une accroche ; la présentation du sujet (définitions, dates) ; la problématique ; l'annonce du plan.",d:"Rédigez l'introduction au brouillon."},
{id:"a7",t:"approf",g:null,q:"Donnez une <b>accroche</b> possible pour le sujet sur la Seconde Guerre mondiale.",a:"« Entre 50 et 70 millions de morts, dont plus de la moitié de civils : c'est la guerre la plus meurtrière de l'histoire. »",d:"Une accroche peut être un chiffre, une citation, un fait marquant."},
{id:"a8",t:"approf",g:null,q:"Quels exemples précis citer pour prouver la <b>répression</b> dans les deux régimes ?",a:"Gestapo, SA et SS, camps de concentration (Dachau, 1933) ; NKVD, dénonciation, goulag, famine des koulaks (1932-1933).",d:"Un bon devoir contient des <b>noms</b>, des <b>dates</b> et des <b>chiffres</b>."},
{id:"a9",t:"approf",g:null,q:"Quels exemples précis citer pour prouver la <b>guerre d'anéantissement</b> ?",a:"Opération Tannenberg (1939), Einsatzgruppen (1,5 million de victimes dès 1941), Shoah (5,7 millions), bombardements urbains, Hiroshima et Nagasaki.",d:"Toujours un exemple daté et chiffré par argument."},
{id:"a10",t:"approf",g:null,q:"Que doit contenir la <b>conclusion</b> ?",a:"Une réponse claire à la problématique qui résume les parties, puis éventuellement une ouverture.",d:"Ouverture possible : le procès de Nuremberg (1945-1946) ou la création de l'ONU (1945)."}

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function level(){
  const xp = mastery(CARDS);
  let i = 0; for (let k = 0; k < LEVELS.length; k++) if (xp >= LEVELS[k][0]) i = k;

  if (i > (S.lvl || 0)) { S.lvl = i; save(); }
  i = Math.max(i, S.lvl || 0);
  const cur = LEVELS[i][0], next = LEVELS[i + 1] ? LEVELS[i + 1][0] : null;
  return {n:i + 1, name:LEVELS[i][1], cur, next, p: next ? Math.max(0, Math.min(1, (xp - cur) / (next - cur))) : 1};
}
function dayStreak(){

  }

}

let toastEl;
function toast(b){
  if (!toastEl) { toastEl = document.createElement("div"); toastEl.className = "toast"; toastEl.setAttribute("role", "status"); document.body.appendChild(toastEl); }

}
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let c = $("#confetti"); if (!c) { c = document.createElement("canvas"); c.id = "confetti"; document.body.appendChild(c); }
  const ctx = c.getContext("2d"), W = c.width = innerWidth, H = c.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--gold","--accent","--c-urss","--c-fp","--c-def","--c-approf"].map(v => cs.getPropertyValue(v).trim() || "#c90");
  const ps = Array.from({length:90}, () => ({x:W/2 + (Math.random()-.5)*80, y:H*.75, vx:(Math.random()-.5)*12, vy:-Math.random()*14-6, r:Math.random()*6+3, c:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6, s:(Math.random()-.5)*.3}));
  let f = 0;
  (function tick(){
    ctx.clearRect(0,0,W,H);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .42; p.vx *= .99; p.a += p.s; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
    if (++f < 110) requestAnimationFrame(tick); else ctx.clearRect(0,0,W,H);
  })();
}

function deviceType(){
  try {
    const touch = matchMedia("(pointer: coarse)").matches;
    if (!touch) return "ordinateur";
    return Math.min(screen.width, screen.height) < 600 ? "téléphone" : "tablette";
  } catch(e) { return ""; }
}
function reportVisit(){
  try {
    if (!STATS_URL || navigator.webdriver) return; // pas de comptage pour les navigateurs pilotés par des robots
    const send = () => {
      ["pointerdown", "keydown", "touchstart"].forEach(ev => removeEventListener(ev, send, true));
      try { if (sessionStorage.getItem("h2-visite")) return; sessionStorage.setItem("h2-visite", "1"); } catch(e) {}
      fetch(STATS_URL, {method: "POST", mode: "no-cors", keepalive: true, headers: {"Content-Type": "text/plain;charset=utf-8"},
        body: JSON.stringify({type: "visite", app: APP_NAME, appareil: deviceType()})}).catch(() => {});
    };
    // La visite n'est comptée qu'au premier vrai geste (clic, toucher ou touche du clavier)
    ["pointerdown", "keydown", "touchstart"].forEach(ev => addEventListener(ev, send, {capture: true, passive: true}));
  } catch(e) {}
}
function report(mode, score, total, results){
  try {
    if (!STATS_URL || navigator.webdriver || !Object.keys(results).length) return;
    const body = JSON.stringify({app: APP_NAME, mode});

}

/* ---------- Mise à jour d'une carte ---------- */
function grade(id, r){ // r : 0 raté, 1 presque, 2 su
  const rec = S.cards[id] || (S.cards[id] = {b:0, ok:0, ko:0});
  const before = rec.b;
  if (r === 2) {
    if (rec.f) { S.comeback++; rec.f = false; }
    delete rec.due;
    rec.b = Math.min(5, Math.max(before, 1) + 1); rec.ok++;
  } else if (r === 1) {
    rec.b = before >= 3 ? before - 1 : Math.max(1, before === 0 ? 1 : before);
    if (before === 0) rec.b = 1;
    rec.due = tomorrow();
  } else {
    rec.b = 1; rec.ko++; rec.f = true; rec.due = tomorrow();
  }
  rec.last = Date.now();
  S.reviewed++; markDay();
}

/* ---------- Sélection des cartes ---------- */
function pool(){ S.sel = S.sel.filter(t => THEMES[t]); return CARDS.filter(c => S.sel.includes(c.t)); }
function pick(list, n){
  const now = Date.now();
  return list.map(c => {
    const r = S.cards[c.id]; const b = r ? r.b : 0;
    let pr = b === 0 ? 1.3 : b === 1 ? 0 : b; // les cartes ratées passent en premier, puis les nouvelles
    if (r && r.last && now - r.last < 8 * 60 * 1000) pr += 1.5;
    return {c, pr: pr + Math.random() * 1.2};
  }).sort((a, b) => a.pr - b.pr).slice(0, n).map(x => x.c);
}

function doFlip(){

  if (F.flipped && !$("#rate")) {
    $("#actions").innerHTML = `<div class="rate" id="rate">
      <button class="r0" data-r="0">Raté<small>reviendra vite</small></button>

  }
}
function rateFlip(r){
  const id = F.queue[F.i];
  grade(id, r);
  if (!(id in F.res)) F.res[id] = r;
  let gain;
  if (r === 2) { F.combo++; S.bestStreak = Math.max(S.bestStreak, F.combo); gain = 10 + Math.min(F.combo - 1, 5) * 2; }
  else { F.combo = 0; gain = r === 1 ? 4 : 1; }
  addXP(gain);
  // les cartes ratées reviennent dans la même session
  const n = F.requeue[id] || 0;
  if (r === 0 && n < 3) { F.queue.splice(Math.min(F.queue.length, F.i + 4), 0, id); F.requeue[id] = n + 1; }
  else if (r === 1 && n < 1) { F.queue.splice(Math.min(F.queue.length, F.i + 7), 0, id); F.requeue[id] = n + 1; }
  if (!F.queue.slice(F.i + 1).includes(id)) F.done++;
  F.i++;
  save(); checkBadges();
  renderFlip();
  if (F.combo >= 2) { const el = $("#combo"); if (el) el.classList.add("pop"); }
}

}
function qcmQuestion(c){

  </div>`;
  const wrongIds = [...new Set(wrong.map(c => c.cid).filter(Boolean))];
  if (wrong.length) { const ag = $("#again"); if (wrongIds.length) ag.onclick = () => startFlip(shuffle(wrongIds)); else ag.remove(); }
  $("#more").onclick = startExam;
  $("#back").onclick = home;
  if (note >= 16) confetti();
  window.scrollTo(0, 0);
}

function startFrise(){
  const dated = shuffle(CARDS.filter(c => c.k));
  const chosen = [];
  for (const c of dated) { if (chosen.length >= 5) break; if (!chosen.some(x => Math.floor(x.k) === Math.floor(c.k))) chosen.push(c); }
  FR = {items: shuffle(chosen), order: [], checked: false, xp0: S.xp, t0: Date.now()};
  view = "frise"; renderFrise();
}
function renderFrise(){
  const done = FR.order.length === FR.items.length;
  const sorted = FR.items.slice().sort((a, b) => a.k - b.k);
  app.innerHTML = `
  <div class="sess-head">
    <button class="ghost" id="quit" aria-label="Retour à l'accueil">${ico("back",16)}</button>
    <div class="prog" aria-hidden="true"><i style="width:${pct(FR.order.length / FR.items.length)}%"></i></div>
    <span class="sess-count">${FR.order.length}/${FR.items.length}</span><span class="combo"></span>
  </div>
  <div class="face" style="--c:var(--c-dates);min-height:0"><div class="fhead"><span class="ftag">Frise chronologique</span><span class="fbox">1919 → 1949</span></div>
    <div class="ruled" style="padding-block:14px"><div class="q" style="padding-block:4px;font-size:clamp(18px,2.8vw,22px)">${FR.checked ? "Voici le bon ordre." : "Touchez les événements du plus ancien au plus récent. Touchez à nouveau pour annuler."}</div></div></div>
  <div class="frise-pool">
    ${FR.items.map(c => {
      const pos = FR.order.indexOf(c.id); const tt = themeOfDate(c);
      let cls = pos >= 0 ? " picked" : "";
      if (FR.checked) cls += sorted[pos] && sorted[pos].id === c.id ? " right" : " wrong";
      return `<button class="ev${cls}" data-id="${c.id}" style="--c:${THEMES[tt].color}" ${FR.checked ? "disabled" : ""}><span class="n">${pos >= 0 ? pos + 1 : ""}</span><span><span class="tg">${esc(THEMES[tt].short)}</span>${esc(c.fl)}</span>${FR.checked ? `<span class="yr">${esc(c.s)}</span>` : ""}</button>`;
    }).join("")}
  </div>
  ${FR.checked ? `<div class="timeline">${sorted.map(c => `<div class="tl" style="--c:${THEMES[themeOfDate(c)].color}"><b>${esc(c.s)}</b>${esc(c.fl)}</div>`).join("")}</div>` : ""}
  <div class="row" style="margin-top:14px">
    ${FR.checked ? `<button class="go" id="again">Nouvelle frise ${ico("arrow",18)}</button><button class="go alt" id="back">Accueil</button>`
      : `<button class="go" id="check" ${done ? "" : "disabled"}>Vérifier</button>`}
  </div>
  <div id="fb"></div>`;
  $("#quit").onclick = () => { save(); home(); };
  if (!FR.checked) app.querySelectorAll(".ev").forEach(b => b.onclick = () => {
    const id = b.dataset.id; const p = FR.order.indexOf(id);
    if (p >= 0) FR.order.splice(p, 1); else FR.order.push(id);
    renderFrise();
  });
  if (!FR.checked) $("#check").onclick = () => {
    FR.checked = true; track("session-frise");
    let good = 0; FR.order.forEach((id, i) => { if (sorted[i].id === id) good++; });
    const fres = {}; FR.items.forEach(c => { const r = sorted[FR.order.indexOf(c.id)].id === c.id ? 2 : 0; fres[c.id] = r; grade(c.id, r); });
    report("Frise", good, FR.items.length, fres, FR.t0);
    let gain = good * 6;
    if (good === FR.items.length) { gain += 20; S.frisePerfect++; confetti(); }
    addXP(gain); save(); checkBadges();
    renderFrise();
    $("#fb").innerHTML = `<div class="feedback ${good === FR.items.length ? "" : "ko"}"><b class="v" style="color:${good === FR.items.length ? "var(--ok)" : "var(--ko)"}">${good}/${FR.items.length} bien placés</b>${good === FR.items.length ? "Frise parfaite : +20 XP de bonus." : "Les événements mal placés sont encadrés en rouge. Relisez la frise ci-dessus."}</div>`;
  };
  else { $("#again").onclick = startFrise; $("#back").onclick = home; }
}

/* =========================================================
   CONSTRUIRE UN PLAN
   ========================================================= */
function head(done, total, count, right){
  return `<div class="sess-head">
    <button class="ghost" id="quit" aria-label="Retour à l'accueil">${ico("back",16)}</button>
    <div class="prog" aria-hidden="true"><i style="width:${pct(done / total)}%"></i></div>
    <span class="sess-count">${count}</span>
    <span class="combo" id="combo">${right || ""}</span>
  </div>`;
}
function bindQuit(){ const q = $("#quit"); if (q) q.onclick = () => { save(); home(); }; }
function intro(color, tag, box, text, still){
  return `<div class="face${still ? "" : " fade-in"}" style="--c:${color};min-height:0"><div class="fhead"><span class="ftag">${tag}</span><span class="fbox">${box}</span></div>
    <div class="ruled" style="padding-block:14px"><div class="q" style="padding-block:6px;font-size:clamp(19px,3vw,24px)">${text}</div></div></div>`;
}
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }
let PL = null;
function planPick(){
  view = "planpick";
  app.innerHTML = `<div class="sess-head"><button class="ghost" id="quit" aria-label="Retour à l'accueil">${ico("back",16)}</button></div>
  ${intro("var(--c-methode)", "Construire un plan", "développement construit", "Choisissez un sujet. Rangez chaque idée dans la bonne partie et repérez l'idée hors sujet (✕).")}
  <div class="subj">${PLANS.map((p, i) => `<button class="ev" data-p="${i}" style="--c:var(--c-methode)"><span class="n">${i + 1}</span><span><span class="tg">Sujet possible</span>${esc(p.s)}</span></button>`).join("")}</div>`;
  bindQuit();
  app.querySelectorAll("[data-p]").forEach(b => b.onclick = () => startPlan(+b.dataset.p));
  window.scrollTo(0, 0);
}
function startPlan(i){ PL = {p: i, as: {}, checked: false, order: shuffle(PLANS[i].ideas.map((_, k) => k)), xp0: S.xp}; view = "plan"; renderPlan(); window.scrollTo(0, 0); }
function renderPlan(){
  const P = PLANS[PL.p], as = PL.as, n = Object.keys(as).length, tot = P.ideas.length;
  const ok = k => as[k] === P.ideas[k].p, score = P.ideas.filter((_, k) => ok(k)).length, perfect = score === tot;
  app.innerHTML = `${head(n, tot, `${n}/${tot}`, "")}
  <div class="face${PL.drawn ? "" : " fade-in"}" style="--c:var(--c-methode);min-height:0"><div class="fhead"><span class="ftag">Sujet possible</span><span class="fbox">${tot} idées à ranger</span></div>
    <div class="ruled" style="padding-block:14px"><div class="q" style="padding-block:4px;font-size:clamp(18px,2.8vw,22px)">« ${esc(P.s)} »</div>
    <div class="skel">${P.parts.map((t, i) => `<div><b>${ROMAN[i]}.</b>${esc(t)}</div>`).join("")}<div class="muted"><b>✕</b>Hors sujet</div></div></div></div>
  ${PL.order.map(k => { const id = P.ideas[k], st = PL.checked ? (ok(k) ? " right" : " wrong") : "";
    return `<div class="idea${st}"><p>${esc(id.t)}${PL.checked && !ok(k) ? `<span class="why">→ ${id.p < 0 ? "Hors sujet : " + esc(id.w) : "Partie " + ROMAN[id.p] + " : " + esc(P.parts[id.p])}</span>` : ""}</p>
      <div class="seg" role="group" aria-label="Partie">${[...P.parts.map((_, i) => i), -1].map(v => `<button data-k="${k}" data-v="${v}" aria-pressed="${as[k] === v}" ${PL.checked ? "disabled" : ""}>${v < 0 ? "✕" : ROMAN[v]}</button>`).join("")}</div></div>`; }).join("")}
  ${PL.checked ? `<div class="feedback ${perfect ? "" : "ko"} fade-in"><b class="v" style="color:${perfect ? "var(--ok)" : "var(--ko)"}">${score}/${tot} idées bien placées</b><div style="margin-bottom:8px">Voici le plan modèle, à savoir refaire le jour de l'évaluation :</div>${planHtml(P)}</div>
    <div class="row" style="margin-top:14px"><button class="go" id="other">Autre sujet ${ico("arrow",18)}</button><button class="go alt" id="back">Accueil</button></div>`
  : `<div class="row" style="margin-top:14px"><button class="go" id="check" ${n < tot ? "disabled" : ""}>Vérifier mon plan ${ico("arrow",18)}</button></div>`}`;
  PL.drawn = true;
  bindQuit();
  if (PL.checked) { $("#other").onclick = planPick; $("#back").onclick = home; return; }
  app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { PL.as[+b.dataset.k] = +b.dataset.v; keepScroll(renderPlan); });
  $("#check").onclick = () => {
    PL.checked = true; track("session-plan"); report("Plan", score, tot, {plan: score});
    let gain = score * 3; if (perfect) { gain += 15; confetti(); }
    addXP(gain); markDay(); save(); checkBadges(); keepScroll(renderPlan);
  };
}

/* =========================================================
   BADGES ET BILAN
   ========================================================= */
function badgesView(){
  view = "badges"; confirmReset = false; renderBadges();
}
function renderBadges(){
  const lv = level(), g = mastery(CARDS);
  app.innerHTML = `
  <div class="sess-head"><button class="ghost" id="quit">${ico("back",16)} Accueil</button></div>
  <section class="bilan fade-in">
    ${g >= .7 ? `<span class="stamp">Prêt !</span>` : ""}
    <span class="ftag" style="color:var(--accent)">Bilan de révision · H1</span>
    <h2>Votre bilan</h2>
    <div class="muted" style="font-size:14.5px">Niveau ${lv.n}/${LEVELS.length} · ${esc(lv.name)} · ${S.xp} XP · ${S.reviewed} cartes révisées · ${Object.keys(S.badges).length}/${BADGES.length} badges</div>
    <div class="tbars">
      ${Object.entries(THEMES).map(([k, t]) => { const m = mastery(inTheme(k)); return `<div class="tbar" style="--c:${t.color}"><span>${esc(t.label)}</span><div class="mbar"><i style="width:${pct(m)}%"></i></div><b>${pct(m)}%</b></div>`; }).join("")}
      <div class="tbar" style="--c:var(--ok);font-weight:700"><span>Total</span><div class="mbar"><i style="width:${pct(g)}%"></i></div><b>${pct(g)}%</b></div>
    </div>
  </section>
  <div class="sec-title"><h3>Badges</h3><span class="muted" style="font-size:14px">${Object.keys(S.badges).length} sur ${BADGES.length}</span></div>
  <div class="badges-grid">
    ${BADGES.map(b => { const has = !!S.badges[b.id]; return `<div class="bitem${has ? "" : " locked"}">${medal(b, !has)}<div><b>${esc(b.name)}</b><p>${esc(b.desc)}</p></div></div>`; }).join("")}
  </div>
  <div class="sec-title"><h3>Recommencer à zéro</h3></div>
  <div class="confirm-box" id="resetZone">
    ${confirmReset ? `<span>Tout effacer (XP, badges, progression) ?</span><button class="danger" id="yes">Oui, tout effacer</button><button class="ghost" id="no">Annuler</button>`
      : `<button class="danger" id="reset">Effacer votre progression</button>`}
  </div>`;
  $("#quit").onclick = home;
  if (confirmReset) { $("#yes").onclick = () => { S = fresh(); save(); home(); }; $("#no").onclick = () => { confirmReset = false; renderBadges(); }; }
  else $("#reset").onclick = () => { confirmReset = true; renderBadges(); };
  window.scrollTo(0, 0);
}

/* ---------- Clavier ---------- */
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (view === "flip") {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!F.flipped || !$("#rate")) doFlip(); else doFlip(); }
    if (F && F.flipped && ["1","2","3"].includes(e.key)) rateFlip(+e.key - 1);
  }
});

home();
reportVisit();
})();

</script>

</body></html>
